name: ClaudeUsage
options:
  bundleIdPrefix: com.sven
  deploymentTarget:
    macOS: "13.0"
packages:
  ClaudeUsageCore:
    path: ../ClaudeUsageCore
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: ClaudeUsage
      - path: Shared
      - path: LaunchDaemons/com.sven.claude-usage.keepawake.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: ClaudeUsage/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Claude Usage
        CFBundleDisplayName: Claude Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sven.claude-usage
        PRODUCT_NAME: "Claude Usage"
        MARKETING_VERSION: "0.8.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: H9PBNT2Q88
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
    dependencies:
      - package: ClaudeUsageCore
        product: ClaudeUsageCore
      - package: ClaudeUsageCore
        product: SleepLease
      - target: claude-usage-sleeperd
        embed: true
        codeSign: true
        copy:
          destination: executables

  # The daemon links Security as well as IOKit: validateClientRequirement() calls
  # SecRequirementCreateWithString to parse the code-signing requirement at
  # startup, so a typo cannot raise an uncatchable exception on every connection.
  claude-usage-sleeperd:
    type: tool
    platform: macOS
    sources:
      - path: Sleeperd
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: claude-usage-sleeperd
        PRODUCT_BUNDLE_IDENTIFIER: com.sven.claude-usage.sleeperd
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: H9PBNT2Q88
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        # CREATE_INFOPLIST_SECTION_IN_BINARY only has something to embed if an
        # Info.plist is generated for the tool. Without this pair the daemon signs
        # under its product name instead of its bundle identifier, so its designated
        # requirement does not pin the identifier of the root binary.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: ClaudeUsageCore
        product: SleepLease
      - sdk: Security.framework
      - sdk: IOKit.framework
